name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Swift 6 and the xcodegen-emitted project format need Xcode 16;
    # macos-14's default toolchain is Xcode 15 and cannot open the project.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 16
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run tests
        run: |
          xcodebuild test \
            -project AvailabilityClick.xcodeproj \
            -scheme AvailabilityClick \
            -destination 'platform=macOS'
