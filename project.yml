name: AvailabilityClick
options:
  bundleIdPrefix: com.availabilityclick
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.40"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    PRODUCT_BUNDLE_IDENTIFIER: com.availabilityclick.AvailabilityClick
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  AvailabilityClick:
    type: application
    platform: macOS
    sources:
      - AvailabilityClick
    settings:
      base:
        INFOPLIST_FILE: AvailabilityClick/Info.plist
        CODE_SIGN_ENTITLEMENTS: AvailabilityClick/AvailabilityClick.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES

  AvailabilityClickTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AvailabilityClickTests
    dependencies:
      - target: AvailabilityClick
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AvailabilityClick.app/Contents/MacOS/AvailabilityClick"
